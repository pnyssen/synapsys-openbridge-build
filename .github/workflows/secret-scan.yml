name: Secret scan (gitleaks)

# Runs on every push and PR, across the whole repo — unlike mcp-tests.yml
# this is NOT path-filtered, because a leaked secret can land in any file,
# not just mcp-servers/ or deploy/mcp-vps/.
#
# Exists because MCP_AUTH_TOKEN_ODOO and MCP_AUTH_TOKEN_N8N were logged in
# deploy/mcp-vps/SECRETS_INDEX.md as "exposed in chat 2026-07-14 (partial)"
# and sat undetected until a manual infrastructure assessment caught it —
# this closes that detection gap going forward instead of depending on
# someone noticing and logging it by hand.
#
# Validated locally before adding this workflow: gitleaks 8.21.2 against
# both the working tree and the full git history (48 commits) at the time
# of writing returned zero findings — no allowlist/config tuning needed.
#
# fetch-depth is a bounded number, NOT 0. actions/checkout special-cases
# `fetch-depth: 0` to mean "fetch full history for EVERY branch and tag in
# the remote", not "full history of this branch" — the first version of
# this workflow used 0 and it caused gitleaks to flag real-looking secrets
# from a completely unrelated branch's commits that happened to be sitting
# in the same fetched .git object store, failing this check for content no
# part of this PR ever touched. A bounded depth fetches only the ref being
# checked out. Raise this number if the branch's own history ever exceeds
# it — it does not need to track real branch length precisely, just stay
# comfortably above it.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1000
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --redact -v

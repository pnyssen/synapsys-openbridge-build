name: MCP servers tests

on:
  push:
    paths:
      - "mcp-servers/**"
      - "deploy/mcp-vps/**"
  pull_request:
    paths:
      - "mcp-servers/**"
      - "deploy/mcp-vps/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r mcp-servers/requirements.txt pytest
      - name: Run tests
        run: pytest mcp-servers/tests/test_transport.py -v

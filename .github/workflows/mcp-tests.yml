name: mcp-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp-servers/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp-servers/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest \
            mcp-servers/tests/test_transport.py \
            mcp-servers/tests/test_mcp_v2_oracle_and_mutation.py \
            mcp-servers/tests/test_write_safety.py \
            mcp-servers/tests/test_n8n_mcp_write_safety.py \
            mcp-servers/tests/test_odoo_mcp_write_safety.py \
            mcp-servers/tests/test_http_boundary.py \
            -v
